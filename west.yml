# The west manifest file (west.yml) for the hpmicro SDK.
#
# The per-workspace west configuration file, .west/config,
# specifies the location of this manifest file like this:
#
#     [manifest]
#     path = sdk_glue

########################################
##  zephyr                    v3.7.0  ##
##  hpm_sdk                   v1.13.0 ##
########################################
manifest:
  version: "1.0"

  remotes:
    - name: test
      url-base: git@192.168.11.211:oss
    - name: github
      url-base: https://github.com/hpmicro
    - name: leadjoy
      url-base: https://github.com/LeadJoy-HyperStrike
    - name: cherry-embedded
      url-base: https://github.com/cherry-embedded/

  defaults:
    remote: github

  projects:
    - name: zephyr
      remote: leadjoy            # LeadJoy fork: carries the HS2 usbd patches (multi-HID HS ep, MS OS 0xEE, set_bcd_device)
      repo-path: zephyr
      revision: leadjoy/hs2-hpm6e00  # LeadJoy HS2-on-HPM6E00 integration branch; freeze by pinning a commit/tag for release
      import:
        name-allowlist:
          - west-commands
          - mbedtls
          - zcbor            # CBOR codec: required by MCUMGR/SMP (HS2's hs2img and os groups)
    - name: sdk_env
      repo-path: sdk_env
      path: sdk_env
      # v1.13.0 官方 tag,自带 HPM5100(soc/HPM5100、boards/hpm5100evk、openocd 配置),
      # 不再需要叠先楫 ER 包的 untracked 文件。checkout 之后照旧跑 `west supply`,
      # 打 scripts/patch/hpm_sdk_v1.13.0/ 下的必需补丁。
      # 相对 ER 包,官方版去掉了 HPM5151 的 EFC / DHC(DMAMUX 源 61 -> 58 路);
      # 先楫 2026-10-12 投放里那份 v1.11.0-hpm5100 本地提交不跟。
      # 从「v1.12.1 + ER 叠加」的旧工作区迁过来:west update 会因那些 untracked /
      # 改过的文件拒绝 checkout。先 `git -C sdk_env clean -n -d` 确认列出的只有
      # HPM5100 叠加,再 `clean -f -d` 并 `git -C sdk_env checkout -- .`,
      # 然后 west update、west supply。
      revision: v1.13.0
      submodules: true
    - name: canopennode
      repo-path: canopennode
      path: modules/lib/canopennode
      revision: dec12fa3f0d790cafa8414a4c2930ea71ab72ffd
    - name: lvgl
      repo-path: zephyr_lvgl
      path: modules/lib/gui/lvgl
      revision: 2b498e6f36d6b82ae1da12c8b7742e318624ecf5
    - name: CherryUSB
      remote: cherry-embedded
      repo-path: CherryUSB
      path: modules/lib/CherryUSB
      revision: 5ffe9cbe7fb41489d99806daa8572124ace1b99b
    - name: fatfs
      repo-path: fatfs
      path: modules/fs/fatfs
      revision: 427159bf95ea49b7680facffaa29ad506b42709b
    - name: mcuboot          # HPMicro's own entry (their MCUboot support, e.g. samples/boot/*).
                             # HS2 boots without a bootloader; hs2_hpm_firmware/west.yml blocklists it.
      repo-path: mcuboot
      revision: c098a7fe3aa03f8e21b6fe083dd8d9704db78a03
      path: bootloader/mcuboot


  # West-related configuration for the sdk_glue repository.
  self:
    path: sdk_glue
    west-commands: scripts/west-commands.yml
