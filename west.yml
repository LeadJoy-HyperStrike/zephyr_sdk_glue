# The west manifest file (west.yml) for the hpmicro SDK.
#
# The per-workspace west configuration file, .west/config,
# specifies the location of this manifest file like this:
#
#     [manifest]
#     path = sdk_glue

########################################
##  zephyr                    v3.7.0  ##
##  hpm_sdk   v1.11.0-hpm5100 (local) ##
########################################
manifest:
  version: "1.0"

  remotes:
    - name: test
      url-base: git@192.168.11.211:oss
    - name: github
      url-base: https://github.com/hpmicro
    - name: cherry-embedded
      url-base: https://github.com/cherry-embedded/

  defaults:
    remote: github

  projects:
    - name: zephyr
      repo-path: zephyr
      revision: zsg_v0.7.0
      import:
        name-allowlist:
          - west-commands
          - mbedtls
    - name: sdk_env
      repo-path: sdk_env
      path: sdk_env
      # Local branch hpm5100-v1.11.0 / tag v1.11.0-hpm5100 (not pushed).
      revision: 4274f9203c17db6fdddeefd97f3b5440fd4ce364
      submodules: true
    - name: canopennode
      repo-path: canopennode
      path: modules/lib/canopennode
      revision: dec12fa3f0d790cafa8414a4c2930ea71ab72ffd
    - name: lvgl
      repo-path: zephyr_lvgl
      path: modules/lib/gui/lvgl
      revision: 2b498e6f36d6b82ae1da12c8b7742e318624ecf5
    - name: CherryUSB
      remote: cherry-embedded
      repo-path: CherryUSB
      path: modules/lib/CherryUSB
      revision: 5ffe9cbe7fb41489d99806daa8572124ace1b99b
    - name: fatfs
      repo-path: fatfs
      path: modules/fs/fatfs
      revision: 427159bf95ea49b7680facffaa29ad506b42709b
    - name: mcuboot
      repo-path: mcuboot
      revision: c098a7fe3aa03f8e21b6fe083dd8d9704db78a03
      path: bootloader/mcuboot
    - name: zcbor
      url: https://github.com/zephyrproject-rtos/zcbor
      revision: 75d088037eb237b18e7ec1f47c9ce494b9b95aab
      path: modules/lib/zcbor


  # West-related configuration for the sdk_glue repository.
  self:
    path: sdk_glue
    west-commands: scripts/west-commands.yml
