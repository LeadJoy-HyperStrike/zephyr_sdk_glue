description: HPMicro DMA(hdma/xdma) controller

compatible: "hpmicro,hpm-dmav2"

include: dma-controller.yaml

properties:
    reg:
      required: true

    interrupts:
      required: true

    clk-name:
      type: int
      required: false
      description: |
        HPM SDK clock_name_t value for this DMA instance. Only read by the
        HPM5100 device-PM action (CONFIG_PM_DEVICE), which gates this clock;
        hpm6exx.dtsi and the other pre-HPM5100 SoC trees do not carry it and
        do not need it.

    dma-channels:
      required: true

    dma-requests:
      required: true

    "#dma-cells":
      type: int
      required: true
      description: Number of items to expect in a DMAMUX specifier


#- #dma-cells : Must be <2>.
#  The 1st cell specifies the channel.
#    Specific request source can only be multiplexed by specific channels
#  The 2nd cell specifies the request source(slot) ID.
#    See the SoC's reference manual for all the supported request sources.

dma-cells:
  - channel
  - source
