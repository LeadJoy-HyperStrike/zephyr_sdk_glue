# HPM5100EVK: 32KB HRAM — keep stacks safe and trim MSC/UDC usage.
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_ISR_STACK_SIZE=1536
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_USBD_THREAD_STACK_SIZE=1536
CONFIG_UDC_BUF_COUNT=16
CONFIG_UDC_BUF_POOL_SIZE=768
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=1

CONFIG_HWINFO=y

CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_MSC_LOG_LEVEL_ERR=y

# Workaround for UDC DMA/cache-coherency during USB enumeration.
CONFIG_DCACHE=n
