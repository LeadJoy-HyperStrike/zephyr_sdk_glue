# SPI3 Zephyr API framed DMA slave (CONFIG_SPI_HPM_SLAVE_FRAMED).
# Peer: HPM SDK dma/master Mode3 cmd=0x1A addr=0x10 128B.
CONFIG_SPI=y
CONFIG_SPI_SLAVE=y
CONFIG_SPI_HPM_SLAVE_FRAMED=y
CONFIG_SPI_HPM_SPI_DMA=y
CONFIG_DMA=y
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=512
CONFIG_ISR_STACK_SIZE=2048
CONFIG_LOG=n
